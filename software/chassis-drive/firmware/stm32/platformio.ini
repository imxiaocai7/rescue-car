[env:stm32-uart-check]
platform = ststm32@20.0.0
board = chassis_f407ve
framework = stm32cube
platform_packages =
    platformio/framework-stm32cubef4@1.28.3
    platformio/tool-ldscripts-ststm32@0.3.0
    platformio/toolchain-gccarmnoneeabi@1.70201.0
lib_deps = symlink://../common
build_flags = -Wall -Wextra
upload_protocol = stlink
debug_tool = stlink
extra_scripts = post:../../tools/export_stm32_hex.py

[env:stm32-motion]
extends = env:stm32-uart-check
build_flags = ${env:stm32-uart-check.build_flags} -DCD_ENABLE_MOTION=1
