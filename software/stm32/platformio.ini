[platformio]
default_envs = f407-communication-only

[env:f407-communication-only]
platform = ststm32@20.0.0
board = rescue_f407ve
framework = stm32cube
platform_packages =
    platformio/framework-stm32cubef4@1.28.3
    platformio/tool-ldscripts-ststm32@0.3.0
    platformio/toolchain-gccarmnoneeabi@1.70201.0
upload_protocol = stlink
debug_tool = stlink
extra_scripts = post:tools/export_hex.py
; This target cannot drive motors. Do NOT run an upload target before board checks.
build_flags =
    -DROVER_COMMUNICATION_ONLY=1
build_src_flags = -std=c11 -Wall -Wextra -Werror -Wpedantic
build_src_filter =
    -<*>
    +<motion_protocol.c>
    +<motion_command_guard.c>
    +<rover_telemetry.c>
    +<commissioning_application.c>
    +<uart_rx_queue.c>
    +<board_commissioning.c>
